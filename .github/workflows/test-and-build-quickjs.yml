name: test and build quickjs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-latest
    outputs:
      edge_version: ${{ steps.version.outputs.edge_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute release metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          major="$(sed -n 's/^#define EDGE_MAJOR_VERSION //p' src/edge_version.h)"
          minor="$(sed -n 's/^#define EDGE_MINOR_VERSION //p' src/edge_version.h)"
          patch="$(sed -n 's/^#define EDGE_PATCH_VERSION //p' src/edge_version.h)"
          if [[ -z "${major}" || -z "${minor}" || -z "${patch}" ]]; then
            echo "Failed to parse EDGE version from src/edge_version.h" >&2
            exit 1
          fi
          edge_version="${major}.${minor}.${patch}"
          release_tag="${edge_version}-nightly"
          release_name="${release_tag}"
          {
            echo "edge_version=${edge_version}"
            echo "release_tag=${release_tag}"
            echo "release_name=${release_name}"
          } >> "${GITHUB_OUTPUT}"

  quickjs-linux:
    name: quickjs-linux
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libicu-dev

      - name: Validate public N-API headers stay V8-agnostic
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE "v8::|<v8.h>|\"v8.h\"" napi/include/js_native_api.h napi/include/node_api.h

      # Which Wasmer the build links against is controlled by repo Actions
      # variables (Settings -> Secrets and variables -> Actions -> Variables):
      # WASMER_SOURCE_REF (build a wasmer commit from source),
      # WASMER_ARTIFACT_RUN_ID (prebuilt dist from a wasmer Builds run; needs
      # the WASMER_ARTIFACTS_TOKEN secret), or neither for the released
      # version (WASMER_RELEASE_VERSION overrides the pin). See
      # scripts/ci/provision-wasmer.sh.
      - name: Resolve Wasmer provisioning
        id: wasmer-provision
        shell: bash
        env:
          WASMER_SOURCE_REF: ${{ vars.WASMER_SOURCE_REF }}
          WASMER_SOURCE_REPO: ${{ vars.WASMER_SOURCE_REPO }}
          WASMER_ARTIFACT_RUN_ID: ${{ vars.WASMER_ARTIFACT_RUN_ID }}
        run: ./scripts/ci/provision-wasmer.sh resolve native

      # Explicit restore/save (not actions/cache) so the expensive source
      # build is saved right after provisioning succeeds, even when a later
      # test step fails — iterating on a red branch shouldn't rebuild wasmer.
      - name: Restore Wasmer source build cache
        id: wasmer-cache
        if: steps.wasmer-provision.outputs.mode == 'source'
        uses: actions/cache/restore@v4
        with:
          path: .wasmer-provision
          key: ${{ steps.wasmer-provision.outputs.cache_key }}

      - name: Provision Wasmer
        shell: bash
        env:
          WASMER_SOURCE_REF: ${{ vars.WASMER_SOURCE_REF }}
          WASMER_SOURCE_REPO: ${{ vars.WASMER_SOURCE_REPO }}
          WASMER_ARTIFACT_RUN_ID: ${{ vars.WASMER_ARTIFACT_RUN_ID }}
          WASMER_RELEASE_VERSION: ${{ vars.WASMER_RELEASE_VERSION }}
          GH_TOKEN: ${{ secrets.WASMER_ARTIFACTS_TOKEN }}
        run: ./scripts/ci/provision-wasmer.sh native

      - name: Save Wasmer source build cache
        if: steps.wasmer-provision.outputs.mode == 'source' && steps.wasmer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .wasmer-provision
          key: ${{ steps.wasmer-provision.outputs.cache_key }}

      - name: Build edge (QuickJS)
        shell: bash
        run: |
          set -euo pipefail
          make build-edge-quickjs-cli CMAKE_BUILD_TYPE=Release JOBS=4

      - name: Test edge (QuickJS)
        shell: bash
        run: |
          set -euo pipefail
          make test-quickjs-only TEST_JOBS=1

      - name: Test locale (Intl/ICU, QuickJS native)
        shell: bash
        run: |
          set -euo pipefail
          make test-quickjs-intl

      - name: Test framework apps (QuickJS native)
        shell: bash
        run: |
          set -euo pipefail
          make framework-test-quickjs-native

      - name: Test standalone builds (QuickJS native)
        shell: bash
        run: |
          set -euo pipefail
          make standalone-build-test-quickjs-native

      - name: Upload harness logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-logs-quickjs-linux
          path: |
            .framework-test*/logs
            .standalone-build-test*/logs
          # The state dirs are dotdirs, which upload-artifact excludes by default.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate dist
        shell: bash
        run: |
          set -euo pipefail
          make dist-only BUILD_DIR=build-edge-quickjs-cli JOBS=4 ZIP_NAME=edge-quickjs-linux-amd64.zip

      - name: Upload artifact edge
        uses: actions/upload-artifact@v4
        with:
          name: edge-quickjs-linux-amd64
          path: edge-quickjs-linux-amd64.zip
          if-no-files-found: error

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  quickjs-macos:
    name: quickjs-macos
    runs-on: macos-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Validate public N-API headers stay V8-agnostic
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE "v8::|<v8.h>|\"v8.h\"" napi/include/js_native_api.h napi/include/node_api.h

      # See the quickjs-linux job for how Wasmer provisioning modes work.
      - name: Resolve Wasmer provisioning
        id: wasmer-provision
        shell: bash
        env:
          WASMER_SOURCE_REF: ${{ vars.WASMER_SOURCE_REF }}
          WASMER_SOURCE_REPO: ${{ vars.WASMER_SOURCE_REPO }}
          WASMER_ARTIFACT_RUN_ID: ${{ vars.WASMER_ARTIFACT_RUN_ID }}
        run: ./scripts/ci/provision-wasmer.sh resolve native

      # Explicit restore/save (not actions/cache) so the expensive source
      # build is saved right after provisioning succeeds, even when a later
      # test step fails — iterating on a red branch shouldn't rebuild wasmer.
      - name: Restore Wasmer source build cache
        id: wasmer-cache
        if: steps.wasmer-provision.outputs.mode == 'source'
        uses: actions/cache/restore@v4
        with:
          path: .wasmer-provision
          key: ${{ steps.wasmer-provision.outputs.cache_key }}

      - name: Provision Wasmer
        shell: bash
        env:
          WASMER_SOURCE_REF: ${{ vars.WASMER_SOURCE_REF }}
          WASMER_SOURCE_REPO: ${{ vars.WASMER_SOURCE_REPO }}
          WASMER_ARTIFACT_RUN_ID: ${{ vars.WASMER_ARTIFACT_RUN_ID }}
          WASMER_RELEASE_VERSION: ${{ vars.WASMER_RELEASE_VERSION }}
          GH_TOKEN: ${{ secrets.WASMER_ARTIFACTS_TOKEN }}
        run: ./scripts/ci/provision-wasmer.sh native

      - name: Save Wasmer source build cache
        if: steps.wasmer-provision.outputs.mode == 'source' && steps.wasmer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .wasmer-provision
          key: ${{ steps.wasmer-provision.outputs.cache_key }}

      - name: Build edge (QuickJS)
        shell: bash
        run: |
          set -euo pipefail
          make build-edge-quickjs-cli CMAKE_BUILD_TYPE=Release JOBS=4

      - name: Test edge (QuickJS)
        shell: bash
        run: |
          set -euo pipefail
          make test-quickjs-only TEST_JOBS=1

      - name: Test locale (Intl/ICU, QuickJS native)
        shell: bash
        run: |
          set -euo pipefail
          make test-quickjs-intl

      - name: Test framework apps (QuickJS native)
        shell: bash
        # Exclude js-gatsby-* on macOS only: `gatsby build` hangs on GitHub
        # macOS runners (a gatsby-worker/sharp issue), and the harness has no
        # build-step timeout, so it hangs the whole job. This is the build
        # step, not EdgeJS running the app. Linux/WASIX build gatsby fine and
        # keep it covered.
        env:
          FRAMEWORK_TEST_EXCLUDE: js-gatsby-staticsite,js-gatsby-staticsite2
        run: |
          set -euo pipefail
          make framework-test-quickjs-native

      - name: Test standalone builds (QuickJS native)
        shell: bash
        env:
          FRAMEWORK_TEST_EXCLUDE: js-gatsby-staticsite,js-gatsby-staticsite2
        run: |
          set -euo pipefail
          make standalone-build-test-quickjs-native

      - name: Upload harness logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-logs-quickjs-macos
          path: |
            .framework-test*/logs
            .standalone-build-test*/logs
          # The state dirs are dotdirs, which upload-artifact excludes by default.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate dist
        shell: bash
        run: |
          set -euo pipefail
          make dist-only BUILD_DIR=build-edge-quickjs-cli JOBS=4 ZIP_NAME=edge-quickjs-darwin-arm64.zip

      - name: Upload artifact edge
        uses: actions/upload-artifact@v4
        with:
          name: edge-quickjs-darwin-arm64
          path: edge-quickjs-darwin-arm64.zip
          if-no-files-found: error

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  quickjs-wasix:
    name: quickjs-wasix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Install wasixcc
        uses: wasix-org/wasixcc@v0.4.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sysroot-tag: v2026-06-25.1
          version: v0.4.3

      # See the quickjs-linux job for how Wasmer provisioning modes work. In
      # source mode this builds the wasmer CLI (with LLVM, since the WASIX
      # runner scripts pass --llvm); the release C-API headers still serve the
      # edge compile, as WASIX resolves the symbols at runtime via the host.
      - name: Resolve Wasmer provisioning
        id: wasmer-provision
        shell: bash
        env:
          WASMER_SOURCE_REF: ${{ vars.WASMER_SOURCE_REF }}
          WASMER_SOURCE_REPO: ${{ vars.WASMER_SOURCE_REPO }}
          WASMER_ARTIFACT_RUN_ID: ${{ vars.WASMER_ARTIFACT_RUN_ID }}
        run: ./scripts/ci/provision-wasmer.sh resolve wasix

      # Explicit restore/save (not actions/cache) so the expensive source
      # build is saved right after provisioning succeeds, even when a later
      # test step fails — iterating on a red branch shouldn't rebuild wasmer.
      - name: Restore Wasmer source build cache
        id: wasmer-cache
        if: steps.wasmer-provision.outputs.mode == 'source'
        uses: actions/cache/restore@v4
        with:
          path: .wasmer-provision
          key: ${{ steps.wasmer-provision.outputs.cache_key }}

      - name: Provision Wasmer
        shell: bash
        env:
          WASMER_SOURCE_REF: ${{ vars.WASMER_SOURCE_REF }}
          WASMER_SOURCE_REPO: ${{ vars.WASMER_SOURCE_REPO }}
          WASMER_ARTIFACT_RUN_ID: ${{ vars.WASMER_ARTIFACT_RUN_ID }}
          WASMER_RELEASE_VERSION: ${{ vars.WASMER_RELEASE_VERSION }}
          GH_TOKEN: ${{ secrets.WASMER_ARTIFACTS_TOKEN }}
        run: ./scripts/ci/provision-wasmer.sh wasix

      - name: Save Wasmer source build cache
        if: steps.wasmer-provision.outputs.mode == 'source' && steps.wasmer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .wasmer-provision
          key: ${{ steps.wasmer-provision.outputs.cache_key }}

      - name: Build edge (QuickJS WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make build-quickjs-wasix

      - name: Test edge (QuickJS WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make test-wasix-quickjs-only TEST_JOBS=1

      - name: Test locale (Intl/ICU, QuickJS WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make test-wasix-quickjs-intl

      - name: Test framework apps (QuickJS WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make framework-test-quickjs-wasix

      - name: Test standalone builds (QuickJS WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make standalone-build-test-quickjs-wasix

      # The exact wasm binary is needed to reproduce CI-only runtime failures
      # locally (the CI wasixcc toolchain/sysroot differs from dev setups).
      - name: Upload WASIX wasm on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-edgejs-wasm
          path: build-quickjs-wasix/edgejs.wasm
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload harness logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: harness-logs-quickjs-wasix
          path: |
            .framework-test*/logs
            .standalone-build-test*/logs
          # The state dirs are dotdirs, which upload-artifact excludes by default.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate dist
        shell: bash
        run: |
          set -euo pipefail
          make dist-only BUILD_DIR=build-quickjs-wasix JOBS=4 ZIP_NAME=edge-quickjs-wasix.zip
          cp quickjs-wasm/wasmer.toml dist/wasmer.toml
          cp -R quickjs-wasm/etc dist/etc
          perl -0pi -e 's#^source = ".*"#source = "./bin/edgejs"#m; s#"/usr/local/ssl" = "\.\./ssl-certs"#"/usr/local/ssl" = "./ssl-certs"#m' dist/wasmer.toml
          rm -f edge-quickjs-wasix.zip
          (cd dist && zip -r ../edge-quickjs-wasix.zip bin bin-compat README.md wasmer.toml ssl-certs etc)

      - name: Upload artifact edge
        uses: actions/upload-artifact@v4
        with:
          name: edge-quickjs-wasix
          path: edge-quickjs-wasix.zip
          if-no-files-found: error

  publish-nightly:
    name: publish-nightly
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs:
      - metadata
      - quickjs-linux
      - quickjs-macos
      - quickjs-wasix
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_GH_TOKEN }}
      TARGET_REPO: wasmerio/edgejs-nightlies
      RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
      RELEASE_NAME: ${{ needs.metadata.outputs.release_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-quickjs-linux-amd64
          path: release-assets/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-quickjs-darwin-arm64
          path: release-assets/macos

      - name: Download WASIX artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-quickjs-wasix
          path: release-assets/wasix

      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-assets -type f -name '*.zip' | sort)
          {
            echo "asset_count=${#files[@]}"
            echo "asset_list<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          printf 'Discovered %s release asset(s)\n' "${#files[@]}"
          printf '%s\n' "${files[@]}"

      - name: Prepare Wasmer publish assets
        id: wasmer
        shell: bash
        run: |
          set -euo pipefail

          linux_zip="$(find release-assets/linux -type f -name '*.zip' | head -n 1)"
          wasix_zip="$(find release-assets/wasix -type f -name '*.zip' | head -n 1)"

          if [[ -z "${linux_zip}" || ! -f "${linux_zip}" ]]; then
            echo "Missing Linux artifact zip" >&2
            exit 1
          fi
          if [[ -z "${wasix_zip}" || ! -f "${wasix_zip}" ]]; then
            echo "Missing WASIX artifact zip" >&2
            exit 1
          fi

          linux_dir="release-assets/linux/unpacked"
          wasix_dir="release-assets/wasix/unpacked"
          rm -rf "${linux_dir}" "${wasix_dir}"
          mkdir -p "${linux_dir}" "${wasix_dir}"

          unzip -q "${linux_zip}" -d "${linux_dir}"
          unzip -q "${wasix_zip}" -d "${wasix_dir}"

          edge_bin="${linux_dir}/bin/edge"
          if [[ ! -x "${edge_bin}" ]]; then
            echo "Expected packaged edge binary at ${edge_bin}" >&2
            exit 1
          fi

          edge_version="$("${edge_bin}" -p "process.versions.edge")"
          if [[ -z "${edge_version}" ]]; then
            echo "Failed to determine EDGE version from packaged binary" >&2
            exit 1
          fi

          if [[ ! -f "${wasix_dir}/wasmer.toml" ]]; then
            echo "Expected wasmer.toml in ${wasix_dir}" >&2
            exit 1
          fi

          {
            echo "edge_version=${edge_version}"
            echo "wasix_dist_dir=${wasix_dir}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Automated nightly build for EDGE ${{ steps.wasmer.outputs.edge_version }}."
            echo
            echo "- Source repo: ${GITHUB_REPOSITORY}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow run: ${RUN_URL}"
            echo "- Uploaded assets from this workflow: ${{ steps.assets.outputs.asset_count }}"
          } > release-notes.md

      - name: Ensure nightly release exists
        shell: bash
        run: |
          set -euo pipefail
          target_ref="$(gh repo view "${TARGET_REPO}" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          if [[ -z "${target_ref}" ]]; then
            echo "Failed to resolve default branch for ${TARGET_REPO}" >&2
            exit 1
          fi
          if ! gh release view "${RELEASE_TAG}" --repo "${TARGET_REPO}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --repo "${TARGET_REPO}" \
              --target "${target_ref}" \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false || true
          fi
          release_id="$(gh api "repos/${TARGET_REPO}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          gh api \
            --method PATCH \
            "repos/${TARGET_REPO}/releases/${release_id}" \
            -f name="${RELEASE_NAME}" \
            -F prerelease=true \
            -F make_latest=false \
            -F body=@release-notes.md \
            >/dev/null

      - name: Upload nightly assets
        if: ${{ steps.assets.outputs.asset_count != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(printf '%s\n' "${{ steps.assets.outputs.asset_list }}" | sed '/^$/d')
          gh release upload "${RELEASE_TAG}" \
            --repo "${TARGET_REPO}" \
            --clobber \
            "${files[@]}"

      - name: Install Wasmer CLI
        shell: bash
        run: |
          set -euo pipefail
          curl https://get.wasmer.io -sSfL | sh -s "v7.2.0"
          echo "${HOME}/.wasmer/bin" >> "${GITHUB_PATH}"
          "${HOME}/.wasmer/bin/wasmer" --version

      - name: Publish to wasmer.wtf
        env:
          WASMER_TOKEN: ${{ secrets.DEV_BACKEND_CIUSER_TOKEN }}
          EDGE_VERSION: ${{ steps.wasmer.outputs.edge_version }}
        shell: bash
        run: |
          set -euo pipefail
          wasmer publish "${{ steps.wasmer.outputs.wasix_dist_dir }}" \
            --registry wasmer.wtf \
            --token "${WASMER_TOKEN}" \
            --version="${EDGE_VERSION}"

      - name: Publish to wasmer.io
        env:
          WASMER_TOKEN: ${{ secrets.PROD_BACKEND_CIUSER_TOKEN }}
          EDGE_VERSION: ${{ steps.wasmer.outputs.edge_version }}
        shell: bash
        run: |
          set -euo pipefail
          wasmer publish "${{ steps.wasmer.outputs.wasix_dist_dir }}" \
            --registry wasmer.io \
            --token "${WASMER_TOKEN}" \
            --version="${EDGE_VERSION}"
