name: test and build

# Builds every Edge.js lane (V8 and QuickJS; Linux, macOS and WASIX) in
# parallel. Each build then fans out, straight from its artifacts, to its Node
# test suite, its framework tests and, on pull requests, a benchmark against
# the base branch. bench-comment posts all benchmark results as one comment as
# soon as the benchmarks finish, without waiting for the tests.
#
#   build-<lane>  -->  test-<lane>
#                 -->  test-frameworks-<lane>
#                 -->  bench-<runtime>  -->  bench-comment
#
# Internal artifacts (build-<lane>) hold what the test jobs read, as tarballs
# so exec bits and dotfiles survive. Their names must not start with "edge-":
# release.yml downloads every edge-* artifact as a release asset.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source ref to build and test for a release
        required: true
        type: string
      release:
        description: Build stable versions and skip nightly publishing
        default: false
        type: boolean

env:
  EDGE_RELEASE_BUILD: ${{ inputs.release && '1' || '0' }}

jobs:
  metadata:
    name: metadata
    runs-on: ubuntu-latest
    outputs:
      edge_version: ${{ steps.version.outputs.edge_version }}
      v8_release_tag: ${{ steps.version.outputs.v8_release_tag }}
      quickjs_release_tag: ${{ steps.version.outputs.quickjs_release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Compute release metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          major="$(sed -n 's/^#define EDGE_MAJOR_VERSION \([0-9][0-9]*\).*/\1/p' src/edge_version.h)"
          minor="$(sed -n 's/^#define EDGE_MINOR_VERSION \([0-9][0-9]*\).*/\1/p' src/edge_version.h)"
          patch="$(sed -n 's/^#define EDGE_PATCH_VERSION \([0-9][0-9]*\).*/\1/p' src/edge_version.h)"
          if [[ -z "${major}" || -z "${minor}" || -z "${patch}" ]]; then
            echo "Failed to parse EDGE version from src/edge_version.h" >&2
            exit 1
          fi
          edge_version="${major}.${minor}.${patch}"
          # The two nightly publishers target wasmerio/edgejs-nightlies with
          # distinct tags so they do not clobber each other's release.
          {
            echo "edge_version=${edge_version}"
            echo "v8_release_tag=${edge_version}-v8-nightly"
            echo "quickjs_release_tag=${edge_version}-nightly"
          } >> "${GITHUB_OUTPUT}"

  # ---------------------------------------------------------------- V8 Linux

  build-v8-linux:
    name: build-v8-linux
    runs-on: ubuntu-latest
    env:
      NAPI_V8_BUILD_METHOD: prebuilt
      SCCACHE_GHA_ENABLED: "true"
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # The prebuilt V8 archive uses ELF compact relocations (CREL), which
          # need LLD 20+: CMake links with it (edge_select_v8_linker), as a
          # local `make build` does.
          sudo apt-get install -y libicu-dev lld-20

      - name: Validate public N-API headers stay V8-agnostic
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE "v8::|<v8.h>|\"v8.h\"" napi/include/js_native_api.h include/node_api.h include/node_api_types.h

      - name: Build edge
        shell: bash
        run: |
          set -euo pipefail
          make build CMAKE_BUILD_TYPE=Release JOBS=4 \
            CMAKE_ARGS='-DCMAKE_C_FLAGS_RELEASE="-O3 -DNDEBUG -g1" -DCMAKE_CXX_FLAGS_RELEASE="-O3 -DNDEBUG -g1"'

      # Tests resolve openssl-cli next to the edge binary; without it the TLS
      # and crypto tests that need it skip instead of failing.
      - name: Pack build for tests
        shell: bash
        run: |
          set -euo pipefail
          test -x build-edge/edge && test -x build-edge/openssl-cli
          tar -czf "${RUNNER_TEMP}/build-v8-linux.tar.gz" build-edge/edge build-edge/openssl-cli

      - name: Upload build for tests
        uses: actions/upload-artifact@v4
        with:
          name: build-v8-linux
          path: ${{ runner.temp }}/build-v8-linux.tar.gz
          compression-level: 0
          retention-days: 7
          overwrite: true
          if-no-files-found: error

      - name: Generate dist
        shell: bash
        run: |
          set -euo pipefail
          make dist-only JOBS=4 ZIP_NAME=edge-linux-amd64.zip

      - name: Upload artifact edge
        uses: actions/upload-artifact@v4
        with:
          name: edge-linux-amd64
          path: edge-linux-amd64.zip
          overwrite: true
          if-no-files-found: error

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  test-v8-linux:
    name: test-v8-linux
    needs: build-v8-linux
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1

      - name: Install Linux test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lldb

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-v8-linux
          path: ${{ runner.temp }}/build

      # The binaries carry the build job's OpenSSL MODULESDIR, an empty
      # directory under build-edge; recreate it for parity.
      - name: Restore build
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/build/build-v8-linux.tar.gz"
          mkdir -p build-edge/deps/openssl/lib/openssl-modules
          test -x build-edge/edge && test -x build-edge/openssl-cli
          EDGE_BYTECODE_CACHE=0 build-edge/edge --version

      - name: Test edge
        id: native_tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/edge-native-crashes"
          sudo sysctl -w "kernel.core_pattern=${RUNNER_TEMP}/edge-native-crashes/core.%e.%p"
          ulimit -c unlimited
          make -o build-edge/edge test-only TEST_JOBS=4

      - name: Capture native crash backtraces
        if: failure() && steps.native_tests.outcome == 'failure'
        timeout-minutes: 5
        shell: bash
        run: scripts/capture-native-crashes.sh build-edge/edge "${RUNNER_TEMP}/edge-native-crashes"

      - name: Upload native crash backtraces
        if: failure() && steps.native_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: edge-v8-linux-crash-backtraces
          path: ${{ runner.temp }}/edge-native-crashes/*.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Test locale (Intl/ICU, V8 native)
        shell: bash
        run: |
          set -euo pipefail
          make -o build-edge/edge test-intl

      - name: Test language (explicit resource management, V8 native)
        shell: bash
        run: |
          set -euo pipefail
          make -o build-edge/edge test-lang

  test-frameworks-v8-linux:
    name: test-frameworks-v8-linux
    needs: build-v8-linux
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-v8-linux
          path: ${{ runner.temp }}/build

      # The binaries carry the build job's OpenSSL MODULESDIR, an empty
      # directory under build-edge; recreate it for parity.
      - name: Restore build
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/build/build-v8-linux.tar.gz"
          mkdir -p build-edge/deps/openssl/lib/openssl-modules
          test -x build-edge/edge && test -x build-edge/openssl-cli
          EDGE_BYTECODE_CACHE=0 build-edge/edge --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      # FRAMEWORK_TEST_SKIP_SAFE matches the quickjs lanes: the safe-mode
      # stage needs a wasmer CLI, which these jobs do not provision.
      - name: Test framework apps (V8 native)
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK_TEST_SKIP_SAFE=1 \
            FRAMEWORK_TEST_NODE_SKIP='js-docusaurus-staticsite,js-docusaurus2-staticsite' \
            make -o build-edge/edge framework-test

      - name: Test standalone builds (V8 native)
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK_TEST_SKIP_SAFE=1 make -o build-edge/edge standalone-build-test

  # ---------------------------------------------------------------- V8 macOS

  build-v8-macos:
    name: build-v8-macos
    runs-on: macos-latest
    env:
      NAPI_V8_BUILD_METHOD: prebuilt
      SCCACHE_GHA_ENABLED: "true"
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1

      - name: Validate public N-API headers stay V8-agnostic
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE "v8::|<v8.h>|\"v8.h\"" napi/include/js_native_api.h include/node_api.h include/node_api_types.h

      - name: Build edge
        shell: bash
        run: |
          set -euo pipefail
          make build CMAKE_BUILD_TYPE=Release JOBS=4

      - name: Pack build for tests
        shell: bash
        run: |
          set -euo pipefail
          test -x build-edge/edge && test -x build-edge/openssl-cli
          COPYFILE_DISABLE=1 tar --no-xattrs -czf "${RUNNER_TEMP}/build-v8-macos.tar.gz" \
            build-edge/edge build-edge/openssl-cli

      - name: Upload build for tests
        uses: actions/upload-artifact@v4
        with:
          name: build-v8-macos
          path: ${{ runner.temp }}/build-v8-macos.tar.gz
          compression-level: 0
          retention-days: 7
          overwrite: true
          if-no-files-found: error

      - name: Generate dist
        shell: bash
        run: |
          set -euo pipefail
          make dist-only JOBS=4 ZIP_NAME=edge-darwin-arm64.zip

      - name: Upload artifact edge
        uses: actions/upload-artifact@v4
        with:
          name: edge-darwin-arm64
          path: edge-darwin-arm64.zip
          overwrite: true
          if-no-files-found: error

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  test-v8-macos:
    name: test-v8-macos
    needs: build-v8-macos
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-v8-macos
          path: ${{ runner.temp }}/build

      - name: Restore build
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/build/build-v8-macos.tar.gz"
          mkdir -p build-edge/deps/openssl/lib/openssl-modules
          test -x build-edge/edge && test -x build-edge/openssl-cli
          EDGE_BYTECODE_CACHE=0 build-edge/edge --version

      - name: Test edge
        shell: bash
        run: |
          set -euo pipefail
          make -o build-edge/edge test-only TEST_JOBS=4

      - name: Test locale (Intl/ICU, V8 native)
        shell: bash
        run: |
          set -euo pipefail
          make -o build-edge/edge test-intl

      - name: Test language (explicit resource management, V8 native)
        shell: bash
        run: |
          set -euo pipefail
          make -o build-edge/edge test-lang

  test-frameworks-v8-macos:
    name: test-frameworks-v8-macos
    needs: build-v8-macos
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-v8-macos
          path: ${{ runner.temp }}/build

      - name: Restore build
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/build/build-v8-macos.tar.gz"
          mkdir -p build-edge/deps/openssl/lib/openssl-modules
          test -x build-edge/edge && test -x build-edge/openssl-cli
          EDGE_BYTECODE_CACHE=0 build-edge/edge --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      # FRAMEWORK_TEST_SKIP_SAFE matches the quickjs lanes: the safe-mode
      # stage needs a wasmer CLI, which these jobs do not provision.
      # Exclude js-gatsby-* on macOS only: `gatsby build` hangs on GitHub macOS
      # runners (a gatsby-worker/sharp issue), and the harness has no build-step
      # timeout, so it hangs the whole job — a retry cannot clear a hang. This is
      # the build step, not EdgeJS running the app. Linux builds gatsby fine and
      # retries the intermittent lmdb segfault instead. Mirrors test-quickjs-macos.
      - name: Test framework apps (V8 native)
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK_TEST_SKIP_SAFE=1 \
            FRAMEWORK_TEST_NODE_SKIP='js-docusaurus-staticsite,js-docusaurus2-staticsite' \
            FRAMEWORK_TEST_EXCLUDE='js-gatsby-staticsite,js-gatsby-staticsite2' \
            make -o build-edge/edge framework-test

      - name: Test standalone builds (V8 native)
        shell: bash
        run: |
          set -euo pipefail
          FRAMEWORK_TEST_SKIP_SAFE=1 make -o build-edge/edge standalone-build-test

  # ---------------------------------------------------------------- V8 WASIX

  build-v8-wasix:
    name: build-v8-wasix
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasixcc
        uses: wasix-org/wasixcc@v0.4.7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sysroot-tag: v2026-10-02.1
          version: v0.4.7

      - name: Install wasm-tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked wasm-tools

      - name: Build edge (WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make build-wasix

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Validate Edge WASIX imports
        shell: bash
        run: |
          set -euo pipefail
          make validate-wasix-imports

      # Build the host provider from the exact N-API revision pinned by EdgeJS.
      # This standalone runner replaces test-time Wasmer CLI provisioning.
      - name: Build standalone N-API CLI
        shell: bash
        run: |
          set -euo pipefail
          make build-napi-wasmer-cli

      # The benchmarks run the PR's build on this runner, and later pull
      # requests compare against the one their base branch's build uploaded.
      - name: Upload N-API runner
        uses: actions/upload-artifact@v4
        with:
          name: napi-wasmer-linux-amd64
          path: build-wasix-napi/target/release/napi_wasmer
          overwrite: true
          if-no-files-found: error

      - name: Pack build for tests
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/build-v8-wasix.tar.gz" \
            build-wasix/edgejs.wasm build-wasix/node-lib build-wasix/icu \
            build-wasix-napi/target/release/napi_wasmer

      - name: Upload build for tests
        uses: actions/upload-artifact@v4
        with:
          name: build-v8-wasix
          path: ${{ runner.temp }}/build-v8-wasix.tar.gz
          compression-level: 0
          retention-days: 7
          overwrite: true
          if-no-files-found: error

      - name: Generate dist
        shell: bash
        run: |
          set -euo pipefail
          make dist-only BUILD_DIR=build-wasix JOBS=4 ZIP_NAME=edge-wasix.zip

      - name: Install Wasmer CLI
        shell: bash
        run: |
          set -euo pipefail
          curl https://get.wasmer.io -sSfL | sh -s "v7.2.0-alpha.3"
          echo "${HOME}/.wasmer/bin" >> "${GITHUB_PATH}"
          "${HOME}/.wasmer/bin/wasmer" --version

      # The WASIX build reads builtin JS and ICU data from the package
      # filesystem, so check the dist maps both staged trees and that bin/edge
      # no longer embeds them.
      - name: Validate dist package (V8 WASIX)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release.py check-dist --dist dist
          wasmer package build --check dist

      # Host N-API packages need a N-API-capable runner, so smoke the dist
      # trees through the standalone napi_wasmer CLI built above.
      - name: Smoke test dist static data (V8 WASIX)
        shell: bash
        env:
          # German month names and Shift_JIS decoding both need ICU data read
          # from /usr/share/edge-icu; bootstrap itself needs /node-lib.
          DIST_SMOKE_JS: >-
            [new Intl.DateTimeFormat('de', {month: 'long', timeZone: 'UTC'}).format(0),
            new TextDecoder('shift_jis').decode(new Uint8Array([0x82, 0xa0])).codePointAt(0).toString(16)].join(' ')
        run: |
          set -euo pipefail
          output="$(build-wasix-napi/target/release/napi_wasmer dist/bin/edge \
            --builtin-js-dir "${PWD}/dist/node-lib" \
            --mount "${PWD}/dist/icu:/usr/share/edge-icu" \
            -- -p "${DIST_SMOKE_JS}")"
          printf '%s\n' "${output}"
          test "${output}" = "Januar 3042"

      - name: Upload artifact edge
        uses: actions/upload-artifact@v4
        with:
          name: edge-wasix
          path: edge-wasix.zip
          overwrite: true
          if-no-files-found: error

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true

  test-v8-wasix:
    name: test-v8-wasix
    needs: build-v8-wasix
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-v8-wasix
          path: ${{ runner.temp }}/build

      # -o keeps make from rebuilding the guest or the runner (the latter is a
      # phony cargo build) when the restored files are present.
      - name: Restore build
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/build/build-v8-wasix.tar.gz"
          test -s build-wasix/edgejs.wasm
          test -f build-wasix/node-lib/.edge-builtin-catalog
          test -f build-wasix/node-lib/internal/bootstrap/realm.js
          test -f build-wasix/icu/icudt78l/res_index.res
          test -x build-wasix-napi/target/release/napi_wasmer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Test edge (V8 WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make -o build-napi-wasmer-cli -o build-wasix/edgejs.wasm test-wasix-v8-only TEST_JOBS=1

      - name: Test locale (Intl/ICU, V8 WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make -o build-napi-wasmer-cli -o build-wasix/edgejs.wasm test-wasix-v8-intl

      - name: Test child processes (V8 WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make -o build-napi-wasmer-cli -o build-wasix/edgejs.wasm test-wasix-v8-process

  test-frameworks-v8-wasix:
    name: test-frameworks-v8-wasix
    needs: build-v8-wasix
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-v8-wasix
          path: ${{ runner.temp }}/build

      # -o keeps make from rebuilding the guest or the runner (the latter is a
      # phony cargo build) when the restored files are present.
      - name: Restore build
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/build/build-v8-wasix.tar.gz"
          test -s build-wasix/edgejs.wasm
          test -f build-wasix/node-lib/.edge-builtin-catalog
          test -f build-wasix/node-lib/internal/bootstrap/realm.js
          test -f build-wasix/icu/icudt78l/res_index.res
          test -x build-wasix-napi/target/release/napi_wasmer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: bash
