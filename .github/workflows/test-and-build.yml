  # ----------------------------------------------------------- QuickJS WASIX

  build-quickjs-wasix:
    name: build-quickjs-wasix
    runs-on: ubuntu-latest
    outputs:
      wasmer_mode: ${{ steps.wasmer-provision.outputs.mode }}
      wasmer_cache_key: ${{ steps.wasmer-provision.outputs.cache_key }}
      wasmer_resolved_sha: ${{ steps.wasmer-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Install wasixcc
        uses: wasix-org/wasixcc@v0.4.7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          sysroot-tag: v2026-10-02.1
          version: v0.4.7

      # See build-quickjs-linux for how Wasmer provisioning modes work. In
      # source mode this builds the wasmer CLI (with LLVM, since the WASIX
      # runner scripts pass --llvm); the release C-API headers still serve the
      # edge compile, as WASIX resolves the symbols at runtime via the host.
      # test-quickjs-wasix provisions the same CLI from this job's outputs.
      - name: Resolve Wasmer provisioning
        id: wasmer-provision
        shell: bash
        env:
          WASMER_SOURCE_REF: ${{ vars.WASMER_SOURCE_REF }}
          WASMER_SOURCE_REPO: ${{ vars.WASMER_SOURCE_REPO }}
          WASMER_ARTIFACT_RUN_ID: ${{ vars.WASMER_ARTIFACT_RUN_ID }}
        run: ./scripts/ci/provision-wasmer.sh resolve wasix

      - name: Record resolved Wasmer revision
        id: wasmer-sha
        shell: bash
        run: echo "sha=${WASMER_RESOLVED_SHA:-}" >> "${GITHUB_OUTPUT}"

      - name: Restore Wasmer source build cache
        id: wasmer-cache
        if: steps.wasmer-provision.outputs.mode == 'source'
        uses: actions/cache/restore@v4
        with:
          path: .wasmer-provision
          key: ${{ steps.wasmer-provision.outputs.cache_key }}

      - name: Provision Wasmer
        shell: bash
        env:
          WASMER_SOURCE_REF: ${{ vars.WASMER_SOURCE_REF }}
          WASMER_SOURCE_REPO: ${{ vars.WASMER_SOURCE_REPO }}
          WASMER_ARTIFACT_RUN_ID: ${{ vars.WASMER_ARTIFACT_RUN_ID }}
          WASMER_RELEASE_VERSION: ${{ vars.WASMER_RELEASE_VERSION }}
          GH_TOKEN: ${{ secrets.WASMER_ARTIFACTS_TOKEN }}
        run: ./scripts/ci/provision-wasmer.sh wasix

      - name: Save Wasmer source build cache
        if: steps.wasmer-provision.outputs.mode == 'source' && steps.wasmer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .wasmer-provision
          key: ${{ steps.wasmer-provision.outputs.cache_key }}

      - name: Build edge (QuickJS WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make build-quickjs-wasix

      # The quickjs-wasm package maps these build outputs and the staged pnpm
      # files (gitignored, written by the build).
      - name: Pack build for tests
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/build-quickjs-wasix.tar.gz" \
            build-quickjs-wasix/edgejs.wasm build-quickjs-wasix/node-lib build-quickjs-wasix/icu \
            quickjs-wasm/pnpm/pnpm.cjs quickjs-wasm/pnpm/worker.bundle.js \
            quickjs-wasm/pnpm/LICENSE quickjs-wasm/pnpm/package.json

      - name: Upload build for tests
        uses: actions/upload-artifact@v4
        with:
          name: build-quickjs-wasix
          path: ${{ runner.temp }}/build-quickjs-wasix.tar.gz
          compression-level: 0
          retention-days: 7
          overwrite: true
          if-no-files-found: error

      - name: Generate dist
        shell: bash
        run: |
          set -euo pipefail
          make dist-only BUILD_DIR=build-quickjs-wasix JOBS=4 ZIP_NAME=edge-quickjs-wasix.zip

      # The WASIX build reads builtin JS and ICU data from the package
      # filesystem, so check the dist maps both staged trees and that bin/edge
      # no longer embeds them, then run the packaged dist itself.
      - name: Validate dist package (QuickJS WASIX)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release.py check-dist --dist dist
          wasmer package build --check dist

      - name: Smoke test dist static data (QuickJS WASIX)
        shell: bash
        env:
          # German month names and Shift_JIS decoding both need ICU data read
          # from /usr/share/edge-icu; bootstrap itself needs /node-lib.
          DIST_SMOKE_JS: >-
            [new Intl.DateTimeFormat('de', {month: 'long', timeZone: 'UTC'}).format(0),
            new TextDecoder('shift_jis').decode(new Uint8Array([0x82, 0xa0])).codePointAt(0).toString(16)].join(' ')
        run: |
          set -euo pipefail
          output="$(wasmer run --stack-size 4194304 dist -- -p "${DIST_SMOKE_JS}")"
          printf '%s\n' "${output}"
          test "${output}" = "Januar 3042"

      - name: Upload artifact edge
        uses: actions/upload-artifact@v4
        with:
          name: edge-quickjs-wasix
          path: edge-quickjs-wasix.zip
          overwrite: true
          if-no-files-found: error

  test-quickjs-wasix:
    name: test-quickjs-wasix
    needs: build-quickjs-wasix
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      # The tests run the guest with the wasmer CLI. Provision the one the
      # build job used: its resolved revision, so a moving source ref cannot
      # give a different CLI, and its cache entry, so source mode does not
      # rebuild it.
      - name: Resolve Wasmer provisioning
        id: wasmer-provision
        shell: bash
        env:
          WASMER_SOURCE_REF: ${{ needs.build-quickjs-wasix.outputs.wasmer_resolved_sha || vars.WASMER_SOURCE_REF }}
          WASMER_SOURCE_REPO: ${{ vars.WASMER_SOURCE_REPO }}
          WASMER_ARTIFACT_RUN_ID: ${{ vars.WASMER_ARTIFACT_RUN_ID }}
        run: ./scripts/ci/provision-wasmer.sh resolve wasix

      - name: Restore Wasmer source build cache
        if: steps.wasmer-provision.outputs.mode == 'source'
        uses: actions/cache/restore@v4
        with:
          path: .wasmer-provision
          key: ${{ needs.build-quickjs-wasix.outputs.wasmer_cache_key || steps.wasmer-provision.outputs.cache_key }}

      - name: Provision Wasmer
        shell: bash
        env:
          WASMER_SOURCE_REF: ${{ needs.build-quickjs-wasix.outputs.wasmer_resolved_sha || vars.WASMER_SOURCE_REF }}
          WASMER_SOURCE_REPO: ${{ vars.WASMER_SOURCE_REPO }}
          WASMER_ARTIFACT_RUN_ID: ${{ vars.WASMER_ARTIFACT_RUN_ID }}
          WASMER_RELEASE_VERSION: ${{ vars.WASMER_RELEASE_VERSION }}
          GH_TOKEN: ${{ secrets.WASMER_ARTIFACTS_TOKEN }}
        run: ./scripts/ci/provision-wasmer.sh wasix

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-quickjs-wasix
          path: ${{ runner.temp }}/build

      - name: Restore build
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/build/build-quickjs-wasix.tar.gz"
          test -s build-quickjs-wasix/edgejs.wasm
          test -f build-quickjs-wasix/node-lib/.edge-builtin-catalog
          test -f build-quickjs-wasix/node-lib/internal/bootstrap/realm.js
          test -f build-quickjs-wasix/icu/icudt78l/res_index.res
          test -f quickjs-wasm/pnpm/pnpm.cjs
          command -v wasmer

      - name: Test edge (QuickJS WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make -o build-quickjs-wasix/edgejs.wasm test-wasix-quickjs-only TEST_JOBS=1

      - name: Smoke test safe mode (QuickJS WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make test-wasix-safe-mode WASIX_PACKAGE_DIR="$PWD/quickjs-wasm"

      - name: Test locale (Intl/ICU, QuickJS WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make -o build-quickjs-wasix/edgejs.wasm test-wasix-quickjs-intl

      - name: Test child processes (QuickJS WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make -o build-quickjs-wasix/edgejs.wasm test-wasix-quickjs-process

      - name: Smoke test npm/pnpm aliases (QuickJS WASIX)
        shell: bash
        run: make test-wasix-pnpm WASIX_PACKAGE_DIR="$PWD/quickjs-wasm"

  test-frameworks-quickjs-wasix:
    name: test-frameworks-quickjs-wasix
    needs: build-quickjs-wasix
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref || github.sha }}

      - name: Ensure submodules are initialized
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git -c protocol.version=2 submodule update --init --recursive --depth=1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      # The tests run the guest with the wasmer CLI. Provision the one the
      # build job used: its resolved revision, so a moving source ref cannot
      # give a different CLI, and its cache entry, so source mode does not
      # rebuild it.
      - name: Resolve Wasmer provisioning
        id: wasmer-provision
        shell: bash
        env:
          WASMER_SOURCE_REF: ${{ needs.build-quickjs-wasix.outputs.wasmer_resolved_sha || vars.WASMER_SOURCE_REF }}
          WASMER_SOURCE_REPO: ${{ vars.WASMER_SOURCE_REPO }}
          WASMER_ARTIFACT_RUN_ID: ${{ vars.WASMER_ARTIFACT_RUN_ID }}
        run: ./scripts/ci/provision-wasmer.sh resolve wasix

      - name: Restore Wasmer source build cache
        if: steps.wasmer-provision.outputs.mode == 'source'
        uses: actions/cache/restore@v4
        with:
          path: .wasmer-provision
          key: ${{ needs.build-quickjs-wasix.outputs.wasmer_cache_key || steps.wasmer-provision.outputs.cache_key }}

      - name: Provision Wasmer
        shell: bash
        env:
          WASMER_SOURCE_REF: ${{ needs.build-quickjs-wasix.outputs.wasmer_resolved_sha || vars.WASMER_SOURCE_REF }}
          WASMER_SOURCE_REPO: ${{ vars.WASMER_SOURCE_REPO }}
          WASMER_ARTIFACT_RUN_ID: ${{ vars.WASMER_ARTIFACT_RUN_ID }}
          WASMER_RELEASE_VERSION: ${{ vars.WASMER_RELEASE_VERSION }}
          GH_TOKEN: ${{ secrets.WASMER_ARTIFACTS_TOKEN }}
        run: ./scripts/ci/provision-wasmer.sh wasix

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: build-quickjs-wasix
          path: ${{ runner.temp }}/build

      - name: Restore build
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "${RUNNER_TEMP}/build/build-quickjs-wasix.tar.gz"
          test -s build-quickjs-wasix/edgejs.wasm
          test -f build-quickjs-wasix/node-lib/.edge-builtin-catalog
          test -f build-quickjs-wasix/node-lib/internal/bootstrap/realm.js
          test -f build-quickjs-wasix/icu/icudt78l/res_index.res
          test -f quickjs-wasm/pnpm/pnpm.cjs
          command -v wasmer

      - name: Test framework apps (QuickJS WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make -o build-quickjs-wasix/edgejs.wasm framework-test-quickjs-wasix

      - name: Test standalone builds (QuickJS WASIX)
        shell: bash
        run: |
          set -euo pipefail
          make -o build-quickjs-wasix/edgejs.wasm standalone-build-test-quickjs-wasix

  # -------------------------------------------------------------- Benchmarks
  #
  # Pull requests only (release.yml calls this workflow with a ref and skips
  # them). Each job compares the PR's build of one runtime with the base
  # branch's build on one runner; see .github/actions/framework-bench and
  # benchmarks/ci/framework-bench.py. The Node.js jobs compare a binary with
  # itself, as a reference and a measure of the noise.

  bench-v8-native:
    name: bench-v8-native
    if: ${{ github.event_name == 'pull_request' && !inputs.ref }}
    needs: build-v8-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/framework-bench
        with:
          runtime: v8-native
          artifact: edge-linux-amd64

  bench-v8-wasix:
    name: bench-v8-wasix
    if: ${{ github.event_name == 'pull_request' && !inputs.ref }}
    needs: build-v8-wasix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/framework-bench
        with:
          runtime: v8-wasix
          artifact: edge-wasix

  bench-quickjs-native:
    name: bench-quickjs-native
    if: ${{ github.event_name == 'pull_request' && !inputs.ref }}
    needs: build-quickjs-linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/framework-bench
        with:
          runtime: quickjs-native
          artifact: edge-quickjs-linux-amd64

  bench-quickjs-wasix:
    name: bench-quickjs-wasix
    if: ${{ github.event_name == 'pull_request' && !inputs.ref }}
    needs: build-quickjs-wasix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # The guest needs the wasmer CLI the build and tests use (it imports
      # wasm_c_api_v0, which older releases lack); see test-quickjs-wasix.
      - name: Resolve Wasmer provisioning
        id: wasmer-provision
        shell: bash
        env:
          WASMER_SOURCE_REF: ${{ needs.build-quickjs-wasix.outputs.wasmer_resolved_sha || vars.WASMER_SOURCE_REF }}
          WASMER_SOURCE_REPO: ${{ vars.WASMER_SOURCE_REPO }}
          WASMER_ARTIFACT_RUN_ID: ${{ vars.WASMER_ARTIFACT_RUN_ID }}
        run: ./scripts/ci/provision-wasmer.sh resolve wasix

      - name: Restore Wasmer source build cache
        if: steps.wasmer-provision.outputs.mode == 'source'
        uses: actions/cache/restore@v4
        with:
          path: .wasmer-provision
          key: ${{ needs.build-quickjs-wasix.outputs.wasmer_cache_key || steps.wasmer-provision.outputs.cache_key }}

      - name: Provision Wasmer
        shell: bash
        env:
          WASMER_SOURCE_REF: ${{ needs.build-quickjs-wasix.outputs.wasmer_resolved_sha || vars.WASMER_SOURCE_REF }}
          WASMER_SOURCE_REPO: ${{ vars.WASMER_SOURCE_REPO }}
          WASMER_ARTIFACT_RUN_ID: ${{ vars.WASMER_ARTIFACT_RUN_ID }}
          WASMER_RELEASE_VERSION: ${{ vars.WASMER_RELEASE_VERSION }}
          GH_TOKEN: ${{ secrets.WASMER_ARTIFACTS_TOKEN }}
        run: ./scripts/ci/provision-wasmer.sh wasix

      - uses: ./.github/actions/framework-bench
        with:
          runtime: quickjs-wasix
          artifact: edge-quickjs-wasix

  bench-node24:
    name: bench-node24
    if: ${{ github.event_name == 'pull_request' && !inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/framework-bench
        with:
          runtime: node24
          lane-node-version: "24"

  bench-node26:
    name: bench-node26
    if: ${{ github.event_name == 'pull_request' && !inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/framework-bench
        with:
          runtime: node26
          lane-node-version: "26"

  # Posts or updates one comment with every runtime's results once all
  # benchmark jobs have finished, including when some failed. It uses the
  # repository's default token and declares no permissions, because
  # release.yml calls this workflow with read-only permissions. Pull requests
  # from forks get a read-only token: the comment then fails and the report
  # is only in the job summary.
  bench-comment:
    name: bench-comment
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !inputs.ref }}
    needs:
      - bench-v8-native
      - bench-v8-wasix
      - bench-quickjs-native
      - bench-quickjs-wasix
      - bench-node24
      - bench-node26
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download benchmark results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: framework-bench-*
          path: ${{ runner.temp }}/bench-results

      - name: Comment on the pull request
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bench-results"
          python3 benchmarks/ci/framework-bench.py comment --post \
            --results-dir "${RUNNER_TEMP}/bench-results" \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-ref "${{ github.event.pull_request.base.ref }}" \
            --run-id "${{ github.run_id }}" \
            --out "${RUNNER_TEMP}/bench-comment.md"

  # ------------------------------------------------------------ Nightlies

  publish-nightly-v8:
    name: publish-nightly-v8
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.release }}
    runs-on: ubuntu-latest
    needs:
      - metadata
      - test-v8-linux
      - test-frameworks-v8-linux
      - test-v8-macos
      - test-frameworks-v8-macos
      - test-v8-wasix
      - test-frameworks-v8-wasix
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_GH_TOKEN }}
      TARGET_REPO: wasmerio/edgejs-nightlies
      RELEASE_TAG: ${{ needs.metadata.outputs.v8_release_tag }}
      RELEASE_NAME: ${{ needs.metadata.outputs.v8_release_tag }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-linux-amd64
          path: release-assets/linux

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-darwin-arm64
          path: release-assets/macos

      - name: Download WASIX artifact
        uses: actions/download-artifact@v4
        with:
          name: edge-wasix
          path: release-assets/wasix

      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-assets -type f -name '*.zip' | sort)
          {
            echo "asset_count=${#files[@]}"
            echo "asset_list<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
          printf 'Discovered %s release asset(s)\n' "${#files[@]}"
          printf '%s\n' "${files[@]}"

      - name: Prepare Wasmer publish assets
        id: wasmer
        shell: bash
        run: |
          set -euo pipefail

          linux_zip="$(find release-assets/linux -type f -name '*.zip' | head -n 1)"
          wasix_zip="$(find release-assets/wasix -type f -name '*.zip' | head -n 1)"

          if [[ -z "${linux_zip}" || ! -f "${linux_zip}" ]]; then
            echo "Missing Linux artifact zip" >&2
            exit 1
          fi
          if [[ -z "${wasix_zip}" || ! -f "${wasix_zip}" ]]; then
            echo "Missing WASIX artifact zip" >&2
            exit 1
          fi

          linux_dir="release-assets/linux/unpacked"
          wasix_dir="release-assets/wasix/unpacked"
          rm -rf "${linux_dir}" "${wasix_dir}"
          mkdir -p "${linux_dir}" "${wasix_dir}"

          unzip -q "${linux_zip}" -d "${linux_dir}"
          unzip -q "${wasix_zip}" -d "${wasix_dir}"

          edge_bin="${linux_dir}/bin/edge"
          if [[ ! -x "${edge_bin}" ]]; then
            echo "Expected packaged edge binary at ${edge_bin}" >&2
            exit 1
          fi

          edge_version="$("${edge_bin}" -p "process.versions.edge")"
          if [[ -z "${edge_version}" ]]; then
            echo "Failed to determine EDGE version from packaged binary" >&2
            exit 1
          fi

          if [[ ! -f "${wasix_dir}/wasmer.toml" ]]; then
            echo "Expected wasmer.toml in ${wasix_dir}" >&2
            exit 1
          fi

          {
            echo "edge_version=${edge_version}"
            echo "wasix_dist_dir=${wasix_dir}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Automated nightly build for EDGE ${{ steps.wasmer.outputs.edge_version }}."
            echo
            echo "- Source repo: ${GITHUB_REPOSITORY}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow run: ${RUN_URL}"
            echo "- Uploaded assets from this workflow: ${{ steps.assets.outputs.asset_count }}"
          } > release-notes.md

      - name: Ensure nightly release exists
        shell: bash
        run: |
          set -euo pipefail
          target_ref="$(gh repo view "${TARGET_REPO}" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          if [[ -z "${target_ref}" ]]; then
            echo "Failed to resolve default branch for ${TARGET_REPO}" >&2
            exit 1
          fi
          if ! gh release view "${RELEASE_TAG}" --repo "${TARGET_REPO}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --repo "${TARGET_REPO}" \
              --target "${target_ref}" \
              --title "${RELEASE_NAME}" \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false || true
          fi
          release_id="$(gh api "repos/${TARGET_REPO}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          gh api \
            --method PATCH \
            "repos/${TARGET_REPO}/releases/${release_id}" \
            -f name="${RELEASE_NAME}" \
            -F prerelease=true \
            -F make_latest=false \
            -F body=@release-notes.md \
            >/dev/null

      - name: Upload nightly assets
        if: ${{ steps.assets.outputs.asset_count != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(printf '%s\n' "${{ steps.assets.outputs.asset_list }}" | sed '/^$/d')
          gh release upload "${RELEASE_TAG}" \
            --repo "${TARGET_REPO}" \
            --clobber \
            "${files[@]}"

      - name: Install Wasmer CLI
        shell: bash
        run: |
          set -euo pipefail
          curl https://get.wasmer.io -sSfL | sh -s "v7.2.0-alpha.3"
          echo "${HOME}/.wasmer/bin" >> "${GITHUB_PATH}"
          "${HOME}/.wasmer/bin/wasmer" --version

      # The nightly runner has no N-API-capable Wasmer, so this package gets
      # the static checks here; the runtime smoke ran in build-v8-wasix.
      - name: Validate WASIX package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/release.py check-dist --dist "${{ steps.wasmer.outputs.wasix_dist_dir }}"
          wasmer package build --check "${{ steps.wasmer.outputs.wasix_dist_dir }}"

      - name: Publish to wasmer.wtf
        env:
          WASMER_TOKEN: ${{ secrets.DEV_BACKEND_CIUSER_TOKEN }}
          EDGE_VERSION: ${{ steps.wasmer.outputs.edge_version }}
        shell: bash
        run: |
          set -euo pipefail
          wasmer publish "${{ steps.wasmer.outputs.wasix_dist_dir }}" \
            --registry wasmer.wtf \
            --token "${WASMER_TOKEN}" \
            --version="${EDGE_VERSION}"

      - name: Publish to wasmer.io
        env:
          WASMER_TOKEN: ${{ secrets.PROD_BACKEND_CIUSER_TOKEN }}
          EDGE_VERSION: ${{ steps.wasmer.outputs.edge_version }}
        shell: bash
        run: |
          set -euo pipefail
          wasmer publish "${{ steps.wasmer.outputs.wasix_dist_dir }}" \
            --registry wasmer.io \
            --token "${WASMER_TOKEN}" \
            --version="${EDGE_VERSION}"

  publish-nightly-quickjs:
    name: publish-nightly-quickjs
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.release }}
    runs-on: ubuntu-latest
    needs:
      - metadata
      - test-quickjs-linux
      - test-frameworks-quickjs-linux
      - test-quickjs-macos
      - test-frameworks-quickjs-macos
      - test-quickjs-wasix
      - test-frameworks-quickjs-wasix
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_GH_TOKEN }}
      TARGET_REPO: wasmerio/edgejs-nightlies
      RELEASE_TAG: ${{ needs.metadata.outputs.quickjs_release_tag }}
