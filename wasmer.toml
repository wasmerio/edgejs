[package]
entrypoint = "edge"
name = "syrusakbary/edgejs"
version = "0.1.24"
description = "Edge.js with host-provided N-API and no embedded JavaScript engine"

# [fs]
# "/node-lib" = "./lib"
[fs]
"/etc" = "./quickjs-wasm/etc"
"/npm" = "./test/deps/npm"
"/pnpm" = "./quickjs-wasm/pnpm"
"/usr/local/ssl" = "./ssl-certs"

[[module]]
name = "edgejs"
source = "./build-wasix/edgejs.wasm"

[[command]]
name = "edgejs"
module = "edgejs"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
atom = "edgejs"
# env = ["EDGEJS_LIB_DIR=/node-lib"]

[[command]]
name = "edge"
module = "edgejs"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
atom = "edgejs"

[[command]]
name = "node"
module = "edgejs"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
atom = "edgejs"

[[command]]
name = "pnpm"
module = "edgejs"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
atom = "edgejs"
main-args = ["/pnpm/edge-pnpm.cjs"]
env = [
  "HOME=/tmp",
  "PATH=/bin:/usr/bin",
  "npm_config_network_concurrency=4",
  "npm_config_node_linker=hoisted",
  "npm_config_npm_path=/bin/edge-npm-internal",
  "npm_config_optimistic_repeat_install=true",
  "npm_config_package_import_method=copy",
  "npm_config_store_dir=/tmp/.pnpm-store",
  "npm_config_update_notifier=false",
]

[[command]]
name = "npm"
module = "edgejs"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
atom = "edgejs"
main-args = ["/pnpm/edge-pnpm.cjs"]
env = [
  "HOME=/tmp",
  "PATH=/bin:/usr/bin",
  "npm_config_network_concurrency=4",
  "npm_config_node_linker=hoisted",
  "npm_config_npm_path=/bin/edge-npm-internal",
  "npm_config_optimistic_repeat_install=true",
  "npm_config_package_import_method=copy",
  "npm_config_store_dir=/tmp/.pnpm-store",
  "npm_config_update_notifier=false",
]

# pnpm delegates some config and publish operations to npm. Keep this target
# separate from the public npm alias so delegation cannot recurse into pnpm.
[[command]]
name = "edge-npm-internal"
module = "edgejs"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
atom = "edgejs"
main-args = ["/npm/bin/npm-cli.js"]
env = [
  "HOME=/tmp",
  "PATH=/bin:/usr/bin",
  "npm_config_update_notifier=false",
]

# child_process.exec()/execSync() run their command through `/bin/sh -c`, so
# without a shell in the package every exec() call fails to spawn. The QuickJS
# package has carried this since it was created; this one was missing it.
[dependencies]
"wasmer/bash" = "1.0.25"
